0<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Music App</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <h1>My Music</h1>
        <label class="file-input">
          <input id="songInput" type="file" accept="audio/*" multiple />
          Add Songs
        </label>
        <button id="clearLibraryBtn" class="danger">Clear Library</button>

        <section>
          <h2>Playlists</h2>
          <div class="playlist-controls">
            <input id="newPlaylistName" type="text" placeholder="New playlist name" />
            <button id="createPlaylistBtn">Create</button>
          </div>
          <ul id="playlistList" class="list"></ul>
        </section>
      </aside>

      <main class="main-content">
        <div class="topbar">
          <input id="searchInput" type="text" placeholder="Search songs..." />
          <span id="libraryCount">0 songs</span>
        </div>

        <section>
          <h2 id="viewTitle">Library</h2>
          <ul id="songList" class="list songs"></ul>
        </section>
      </main>

      <section class="queue-panel">
        <h2>Queue</h2>
        <ul id="queueList" class="list"></ul>
        <button id="clearQueueBtn">Clear Queue</button>
      </section>
    </div>

    <footer class="player">
      <div class="now-playing">
        <strong id="currentSongTitle">No track selected</strong>
        <span id="currentSongMeta">Add songs to start listening</span>
      </div>

      <div class="controls">
        <button id="prevBtn" title="Previous">⏮</button>
        <button id="playPauseBtn" title="Play/Pause">▶</button>
        <button id="nextBtn" title="Next">⏭</button>
        <button id="shuffleBtn" title="Shuffle">Shuffle: Off</button>
        <button id="repeatBtn" title="Repeat">Repeat: Off</button>
      </div>

      <div class="timeline">
        <span id="currentTime">0:00</span>
        <input id="seekBar" type="range" min="0" max="100" step="0.1" value="0" />
        <span id="duration">0:00</span>
      </div>

      <div class="volume">
        <label for="volumeBar">Volume</label>
        <input id="volumeBar" type="range" min="0" max="1" step="0.01" value="0.9" />
      </div>
    </footer>

    <audio id="audioPlayer"></audio>
    <script src="app.js"></script>
  </body>
</html>
