<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <img class="background-image" src="https://static.wixstatic.com/media/88a964_939f0409f70743ea9d2f525fe836a491~mv2.jpg" alt="Background">
    <div class="login-box">
      <h1 class="login-title">Login</h1>
      
      
      <form class="login-form">
        <label class="form-label" for="email">Email</label>
        <input type="email" id="email" class="form-input" placeholder="Enter your email">
        
        <label class="form-label" for="password">Password</label>
        <input type="password" id="password" class="form-input" placeholder="Enter your password">

        <button type="submit" class="login-button">LOGIN</button>
      </form>
      
      <p class="new-user">
        New User? <a href="#" class="signup-link">Sign-up Now</a>
      </p>
      
      <div class="social-connect">
        <div class="social-icons">
          <!-- Google Button -->
          <div class="social-icon-container">
            <div class="social-icon google">
              <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" alt="Google">
            </div>
            <span class="hover-text">Sign up with Google</span>
          </div>
      
          <!-- Facebook Button -->
          <div class="social-icon-container">
            <div class="social-icon facebook">
              <img src="https://cdn-icons-png.flaticon.com/512/733/733547.png" alt="Facebook">
            </div>
            <span class="hover-text">Sign up with Facebook</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
